<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00297A"/>
      <stop offset="50%"  stop-color="#003DA5"/>
      <stop offset="100%" stop-color="#1a56c4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E8001C"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#00A3CC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="50%">
      <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="50%">
      <stop offset="0%"   stop-color="#E8001C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8001C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative circles -->
  <circle cx="100"  cy="100"  r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="1100" cy="530"  r="220" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="600"  cy="315"  r="400" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)"/>

  <!-- Trophy + ball -->
  <text x="600" y="210"
    font-size="110"
    text-anchor="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🏆⚽</text>

  <!-- Main title -->
  <text x="600" y="330"
    font-size="68"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif"
    letter-spacing="2">2026W杯 スケジュールチェッカー</text>

  <!-- Gold underline -->
  <rect x="300" y="348" width="600" height="3" rx="2" fill="#D4AF37" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="600" y="405"
    font-size="32"
    text-anchor="middle"
    fill="rgba(255,255,255,0.65)"
    font-family="'Helvetica Neue', Arial, sans-serif"
    letter-spacing="6">Soccer World Cup 2026</text>

  <!-- Host flags -->
  <text x="600" y="480"
    font-size="52"
    text-anchor="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🇺🇸　🇨🇦　🇲🇽</text>

  <!-- Description -->
  <text x="600" y="552"
    font-size="26"
    text-anchor="middle"
    fill="rgba(255,255,255,0.5)"
    font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif"
    letter-spacing="1">全104試合の日程を日本時間でスピーディーにチェック</text>
</svg>
