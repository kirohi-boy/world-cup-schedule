<svg width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00297A"/>
      <stop offset="50%"  stop-color="#003DA5"/>
      <stop offset="100%" stop-color="#1a56c4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E8001C"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#00A3CC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="60%">
      <stop offset="0%"   stop-color="#E8001C" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#E8001C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow1)"/>
  <rect width="1200" height="1200" fill="url(#glow2)"/>

  <!-- Decorative circles -->
  <circle cx="600" cy="600" r="520" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="600" cy="600" r="380" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="150" cy="150" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="1050" cy="1050" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="1185" width="1200" height="15" fill="url(#accent)"/>

  <!-- Trophy + Ball -->
  <text x="600" y="330"
    font-size="180"
    text-anchor="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🏆</text>

  <text x="600" y="490"
    font-size="90"
    text-anchor="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">⚽</text>

  <!-- Main title line 1 -->
  <text x="600" y="620"
    font-size="88"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">2026W杯</text>

  <!-- Main title line 2 -->
  <text x="600" y="720"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">スケジュールチェッカー</text>

  <!-- Gold underline -->
  <rect x="200" y="742" width="800" height="4" rx="2" fill="#D4AF37" opacity="0.85"/>

  <!-- Subtitle -->
  <text x="600" y="810"
    font-size="42"
    text-anchor="middle"
    fill="rgba(255,255,255,0.65)"
    font-family="'Helvetica Neue', Arial, sans-serif"
    letter-spacing="6">Soccer World Cup 2026</text>

  <!-- Host flags -->
  <text x="600" y="920"
    font-size="80"
    text-anchor="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🇺🇸　🇨🇦　🇲🇽</text>

  <!-- Description -->
  <text x="600" y="1010"
    font-size="36"
    text-anchor="middle"
    fill="rgba(255,255,255,0.5)"
    font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">全104試合の日程を日本時間でチェック</text>
</svg>
