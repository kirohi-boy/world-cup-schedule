<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026W杯 スケジュールチェッカー</title>
  <meta name="description" content="2026年サッカーW杯の試合日程を日本時間（JST）で確認。全104試合の対戦カード・注目選手・FIFAランキングを掲載。">

  <!-- OGP -->
  <meta property="og:title" content="2026W杯 スケジュールチェッカー">
  <meta property="og:description" content="2026年サッカーW杯の試合日程を日本時間（JST）で確認。全104試合の対戦カード・注目選手・FIFAランキングを掲載。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kirohi-boy.github.io/world-cup-schedule/">
  <meta property="og:site_name" content="2026W杯 スケジュールチェッカー">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="2026W杯 スケジュールチェッカー">
  <meta name="twitter:description" content="2026年サッカーW杯の試合日程を日本時間（JST）で確認。全104試合の対戦カード・注目選手・FIFAランキングを掲載。">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <p class="header-sub">Soccer World Cup 2026 | 北中米開催 🇺🇸🇨🇦🇲🇽</p>
      <div class="header-row">
        <div class="header-trophy">🏆</div>
        <h1 class="header-title">2026W杯 スケジュールチェッカー</h1>
        <div class="header-ball">⚽</div>
      </div>
      <span class="period-text">大会期間：2026年6月12日（JST）〜 7月20日（JST）</span>
    </div>
  </header>

  <main class="main">
    <section class="date-nav">
      <button class="nav-btn" id="prevBtn" aria-label="前の日">&#8249;</button>
      <div class="date-display">
        <input type="date" id="datePicker" class="date-picker"
          min="2026-06-12" max="2026-07-20">
        <div class="date-label" id="dateLabel"></div>
      </div>
      <button class="nav-btn" id="nextBtn" aria-label="次の日">&#8250;</button>
    </section>

    <section class="matches-section">
      <div class="stage-summary" id="stageSummary"></div>
      <div class="matches-grid" id="matchesGrid"></div>
      <div class="no-matches hidden" id="noMatches">
        <div class="no-matches-icon">📅</div>
        <p class="no-matches-text">この日は試合がありません</p>
        <p class="no-matches-sub" id="noMatchesSub"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>※ 試合時刻はすべて日本時間（JST）で表示しています</p>
    <p>※ 対戦カード・グループ編成は参考情報です。最新情報はFIFA公式サイトをご確認ください</p>
    <p>※ FIFAランキングは2026年4月1日時点のデータです（出典：<a href="https://www.fifa.com/en/world-rankings" target="_blank" rel="noopener noreferrer" style="color:inherit;">FIFA公式サイト</a>）</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
